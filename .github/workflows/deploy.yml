name: Deploy Loy Krathong 3D to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# กำหนดสิทธิ์สำหรับ GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# อนุญาตให้รัน deploy ได้ครั้งละ 1 workflow เพื่อป้องกัน deployment ชนกัน
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # 1. ขั้นตอน Build (Continuous Integration)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Web Application
        run: npm run build

      - name: Upload Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # 2. ขั้นตอน Deploy (Continuous Deployment)
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
